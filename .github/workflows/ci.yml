name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Workspace Lint Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint

      - name: Type check workspaces
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build
